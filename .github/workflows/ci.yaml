name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        go-version: "1.26.x"
    - run: go test ./...
    - run: docker build -t hpa-scale-to-zero-poc:ci .
    - run: docker build --build-arg TARGET=control-ui -t hpa-scale-to-zero-control-ui:ci .
    - run: docker build --build-arg TARGET=terminal-ui -t hpa-scale-to-zero-terminal-ui:ci .
